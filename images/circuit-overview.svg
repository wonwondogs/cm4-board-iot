<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
<title id="title">CM4 carrier board functional paths</title>
<desc id="desc">Normal boot connects the CM4 through a USB switch and host hub to two USB-A ports. Recovery connects USB-C through a recovery hub and USB switch to the CM4, with the STM32 also connected to the recovery hub. Power control supplies the CM4; its SD interface connects to microSD.</desc>
<defs><style>
text{font-family:Helvetica,Arial,sans-serif;fill:#222}.label{font-size:25px;font-weight:600}.node{font-size:27px;font-weight:500;text-anchor:middle}.detail{font-size:20px;fill:#555;text-anchor:middle}.note{font-size:22px;fill:#555}.box{fill:#fafafa;stroke:#333;stroke-width:2}.link{fill:none;stroke:#333;stroke-width:2}.power{fill:none;stroke:#333;stroke-width:2;marker-end:url(#arrow)}
</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#333" stroke-width="1.5"/></marker></defs>
