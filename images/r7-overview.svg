<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1045" viewBox="0 0 1600 1045" role="img" aria-labelledby="title desc">
<title id="title">Provisional R7 functional overview</title><desc id="desc">A provisional block diagram of R7 power inputs, USB host expansion with LTE, recovery and console access, microSD storage, and battery-backed RTC. This is a development concept, not a finalized or hardware-validated schematic.</desc>
<defs><style>text{font-family:Helvetica,Arial,sans-serif;fill:#222}.section{font-size:26px;font-weight:600}.node{font-size:27px;text-anchor:middle}.detail{font-size:21px;fill:#555;text-anchor:middle}.note{font-size:22px;fill:#555}.box{fill:#fafafa;stroke:#333;stroke-width:2}.link{fill:none;stroke:#333;stroke-width:2}.power{fill:none;stroke:#333;stroke-width:2;marker-end:url(#arrow)}.divider{stroke:#ddd;stroke-width:1}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#333" stroke-width="1.5"/></marker></defs><rect width="1600" height="1045" fill="white"/><text x="40" y="38" class="section" >Power</text><rect x="40" y="60" width="260" height="70" class="box"/><text x="170.0" y="90" class="node" >USB-C</text><text x="170.0" y="116" class="detail" >5 V input</text><rect x="40" y="160" width="260" height="70" class="box"/><text x="170.0" y="190" class="node" >External input</text><text x="170.0" y="216" class="detail" >Nominal 12 V</text><rect x="440" y="110" width="350" height="70" class="box"/><text x="615.0" y="140" class="node" >Power section</text><text x="615.0" y="166" class="detail" >Protection / DC-DC / selection</text><rect x="1050" y="60" width="340" height="70" class="box"/><text x="1220.0" y="90" class="node" >CM4 supply</text><text x="1220.0" y="116" class="detail" >Switched 5 V</text><rect x="1050" y="160" width="340" height="70" class="box"/><text x="1220.0" y="190" class="node" >LTE supply</text><text x="1220.0" y="216" class="detail" >Dedicated regulated rail</text><path d="M300 95 H360 V130 H440" class="link"/><path d="M300 195 H360 V160 H440" class="link"/><path d="M790 130 H900 V95 H1042" class="power"/><path d="M790 160 H900 V195 H1042" class="power"/><text x="40" y="267" class="note" >LTE power is supplied from the 12 V path. Individual protection and switching stages are grouped.</text><line x1="40" y1="290" x2="1560" y2="290" class="divider"/><text x="40" y="329" class="section" >Normal USB host operation</text><rect x="40" y="365" width="260" height="70" class="box"/><text x="170.0" y="395" class="node" >CM4 Lite</text><text x="170.0" y="421" class="detail" >USB host</text><rect x="430" y="365" width="360" height="70" class="box"/><text x="610.0" y="409" class="node" >USB switch + host hub</text><rect x="1000" y="325" width="260" height="70" class="box"/><text x="1130.0" y="369" class="node" >USB-A × 2</text><rect x="1000" y="435" width="260" height="70" class="box"/><text x="1130.0" y="465" class="node" >LTE module</text><text x="1130.0" y="491" class="detail" >Mini PCIe / USB</text><rect x="1370" y="435" width="190" height="70" class="box"/><text x="1465.0" y="479" class="node" >Nano-SIM</text><path d="M300 400 H430 M790 400 H900 V360 H1000 M900 400 V470 H1000 M1260 470 H1370" class="link"/><line x1="40" y1="530" x2="1560" y2="530" class="divider"/><text x="40" y="570" class="section" >USB recovery and console</text><rect x="40" y="610" width="260" height="70" class="box"/><text x="170.0" y="640" class="node" >USB-C</text><text x="170.0" y="666" class="detail" >Host computer</text><rect x="430" y="610" width="360" height="70" class="box"/><text x="610.0" y="654" class="node" >Recovery hub</text><rect x="1000" y="585" width="560" height="125" class="box"/><text x="1280" y="619" class="node" >CM4 recovery via USB switch</text><text x="1280" y="656" class="node" >STM32 controller</text><text x="1280" y="691" class="node" >USB-UART bridge → CM4 console</text><path d="M300 645 H430 M790 645 H1000" class="link"/><text x="40" y="756" class="note" >STM32 manages CM4 power, boot mode and USB routing. Recovery and host modes use alternate paths.</text><line x1="40" y1="785" x2="1560" y2="785" class="divider"/><text x="40" y="825" class="section" >Storage and timekeeping</text><rect x="40" y="880" width="260" height="70" class="box"/><text x="170.0" y="924" class="node" >CM4 Lite</text><rect x="430" y="845" width="360" height="70" class="box"/><text x="610.0" y="875" class="node" >microSD</text><text x="610.0" y="901" class="detail" >SD interface</text><rect x="430" y="955" width="360" height="70" class="box"/><text x="610.0" y="985" class="node" >RTC</text><text x="610.0" y="1011" class="detail" >RV-3028 / I²C</text><rect x="1050" y="955" width="340" height="70" class="box"/><text x="1220.0" y="985" class="node" >3 V backup battery</text><text x="1220.0" y="1011" class="detail" >RTC timekeeping only</text><path d="M300 915 H360 V880 H430 M360 915 V990 H430" class="link"/><path d="M1050 990 H798" class="power"/><text x="930" y="975" class="detail" >Backup power</text></svg>